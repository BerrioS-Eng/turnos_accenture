spring.application.name=turnos-api
server.port=8080

# ---------- SQLite local ----------
spring.datasource.url=jdbc:sqlite:turnos.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite admite un solo escritor a la vez: una conexión evita errores de "database is locked"
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Reglas del caso ----------
# Archivo con los turnos de la mañana (se carga al iniciar)
turnos.archivo-inicial=classpath:data/turnos_hoy.csv
# Numeración secuencial de 1 a 999; al llegar a 999 vuelve a 1
turnos.numero-maximo=999

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
