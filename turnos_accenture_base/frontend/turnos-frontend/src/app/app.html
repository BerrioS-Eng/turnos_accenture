<div class="app-shell">

      <span class="brand__mark">T</span>
      <span>Mi turno en línea</span>
    </a>
    <nav class="view-switch" aria-label="Cambiar vista">

      <a routerLink="/atendedor" routerLinkActive="view-switch__link--active">Atendedor</a>
    </nav>
  </header>
  <main class="app-content">

  </main>
</div>
